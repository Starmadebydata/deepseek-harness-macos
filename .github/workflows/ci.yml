name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Validate bundled sidebar plugin
        run: |
          node --check Plugins/dsh-right-sidebar/lib/index.js
          node --check Plugins/dsh-right-sidebar/lib/client.js
          bash -n script/install_sidebar_plugin.sh
          bash -n script/build_and_run.sh
      - name: Build app bundle
        run: ./script/build_and_run.sh --build
      - name: Validate app bundle
        run: |
          plutil -lint "dist/DeepSeek Harness.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "dist/DeepSeek Harness.app"
